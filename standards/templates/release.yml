# Release automation for the modules, ADR-013 in docket-architecture.
#
# On every push to main, release-please reads the Conventional Commits that
# touched modules/ since the last release. When a feat, fix, perf or breaking
# change is among them, it opens or updates one release pull request with the
# next version and the changelog. A person approves and merges it, which is
# the deliberate act; merging creates the vX.Y.Z tag that
# docket-infrastructure pins with ?ref=, and Renovate proposes the bump there.
#
# What it reads lives in two files: release-please-config.json (the package,
# the tag format, the starting commit) and .release-please-manifest.json (the
# last released version).
#
# It needs one organisation setting: Settings, Actions, General, Workflow
# permissions, "Allow GitHub Actions to create and approve pull requests".
# The default token stays read-only; this workflow raises it below.
#
# The release pull request is opened with GITHUB_TOKEN, so no workflow runs on
# it. It only touches the changelog and the version files, and its title is
# fixed by the configuration.

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# Two runs at once would race to update the same release pull request.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
