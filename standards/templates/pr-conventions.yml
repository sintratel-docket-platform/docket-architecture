# Convention gates — enforce the rules in AGENTS.md mechanically.
#
# Place at .github/workflows/pr-conventions.yml in EVERY repository.
# Register both jobs as required checks in branch protection.
#
# A convention that is not enforced is a suggestion. These two jobs are what
# turn the commit and branch standards into something that cannot be skipped.

name: PR conventions

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-conventions-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  title:
    name: PR title is a Conventional Commit
    runs-on: ubuntu-latest
    steps:
      # Repositories squash-merge, so the PR title becomes the commit on main.
      # A malformed title produces malformed history and breaks the semantic
      # versioning and release notes work that consumes it (cards #12 and #24).
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
          subjectPattern: ^(?![A-Z]).+[^.]$
          subjectPatternError: |
            The subject "{subject}" is invalid.
            Use the imperative mood, start lowercase, and omit the trailing period.
            Example: feat(platform): install controllers and Argo CD with Helm

  branch:
    name: Branch name and language
    runs-on: ubuntu-latest
    steps:
      - name: Branch name follows <type>/<card>-<slug>
        run: |
          branch="${{ github.head_ref }}"
          pattern='^(feat|fix|docs|refactor|perf|test|build|ci|chore|revert)/[0-9]+-[a-z0-9]+(-[a-z0-9]+)*$'
          if ! printf '%s' "$branch" | grep -qE "$pattern"; then
            echo "::error::Branch '$branch' does not match <type>/<card-number>-<slug>."
            echo "Examples: feat/9-terraform-ci-pipeline, fix/16-oidc-subject-format"
            exit 1
          fi
          echo "Branch name OK: $branch"

      # Cheap guard against the project's most common regression. Catches
      # accented characters and the Spanish words that were previously the
      # convention, in the title and in the branch name.
      - name: No non-English text in title or branch
        run: |
          title="${{ github.event.pull_request.title }}"
          branch="${{ github.head_ref }}"
          fail=0

          if printf '%s' "$title$branch" | grep -qP '[áéíóúñÁÉÍÓÚÑ¿¡]'; then
            echo "::error::Accented characters found. English only (AGENTS.md section 2)."
            fail=1
          fi

          words='ambiente|efimero|persistente|plataforma|registro|identidad|verificar|huerfanos|construir|enrutado|convenciones|operacion|decisiones|logica|infraestructura'
          if printf '%s' "$title$branch" | grep -qiE "\\b($words)\\b"; then
            echo "::error::Spanish vocabulary found. English only (AGENTS.md section 2)."
            fail=1
          fi

          exit "$fail"

  constitution:
    name: AGENTS.md matches the canonical copy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The constitution has to physically exist in every repository, because an
      # agent reads the one next to the code it is changing. Copies rot, so this
      # compares against the source. docket-architecture is public, which is what
      # lets a private repository fetch it with no credential.
      - name: Compare against docket-architecture/standards/AGENTS.md
        run: |
          curl -fsSL -o /tmp/canonical.md https://raw.githubusercontent.com/sintratel-docket-platform/docket-architecture/main/standards/AGENTS.md || {
            echo "::warning::Could not fetch the canonical copy; skipping the drift check."
            exit 0
          }
          if diff -q /tmp/canonical.md AGENTS.md > /dev/null; then
            echo "AGENTS.md matches the canonical copy."
          else
            echo "::error::AGENTS.md has drifted from the canonical copy."
            echo "Source: docket-architecture/standards/AGENTS.md"
            echo "Fix by copying the source here, not by editing it there."
            diff /tmp/canonical.md AGENTS.md | head -40
            exit 1
          fi
